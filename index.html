<html lang="id">
<head>

        "sizes": "192x192",

      }
    ]
  }' />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->

    tailwind.config = {

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- HTML5-QRCode Library untuk Scan Kamera Real-time -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- QRCode.js untuk Generate QR Code Dinamis -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    /* Full Page Override agar menutupi elemen bawaan Blogger secara utuh */
    html, body {
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      font-family: 'Inter', sans-serif;
      color: #0f172a;
      overflow-x: hidden;
    }

    #smartattend-root {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* Glassmorphism Utilities */
    .glass-panel {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.06);
    }

    .glass-nav {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-color: rgba(226, 232, 240, 0.9);
    }

    /* Responsive Layout: Desktop Sidebar vs Mobile Bottom Nav */
    @media (min-width: 768px) {
      .desktop-sidebar {
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 268px;
        flex-direction: column;
        z-index: 40;
      }
      .mobile-bottom-nav {
        display: none !important;
      }
      .main-workspace {
        margin-left: 268px;
        padding-bottom: 2rem;
      }
    }

    @media (max-width: 767px) {
      .desktop-sidebar {
        display: none !important;
      }
      .mobile-bottom-nav {
        display: flex;
        position: fixed;
        bottom: 12px;
        left: 12px;
        right: 12px;
        z-index: 50;
        border-radius: 20px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
      }
      .main-workspace {
        margin-left: 0;
        padding-bottom: 6.5rem;
      }
    }

    /* Styling Scanner Area */
    #qr-reader {
      border: none !important;
      border-radius: 16px;
      overflow: hidden;
    }
    #qr-reader video {
      border-radius: 16px;
      object-fit: cover !important;
    }
    #qr-reader__scan_region img {
      display: none !important;
    }
    #qr-reader__dashboard_section_csr button,
    #qr-reader__dashboard_section_swaplink {
      background: #2563eb !important;
      color: #ffffff !important;
      border: none !important;
      padding: 8px 16px !important;
      border-radius: 10px !important;
      font-size: 13px !important;
      font-weight: 600 !important;
      cursor: pointer !important;
      margin: 6px 4px !important;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div id="smartattend-root">
    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-[999999] flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

    <!-- Custom Modal Container (Pengganti alert/confirm) -->
    <div id="custom-modal-backdrop" class="hidden fixed inset-0 z-[999998] bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
      <div id="custom-modal-box" class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 transform transition-all">
        <!-- Konten modal dirender dinamis -->
      </div>
    </div>

    <!-- App Container -->
    <div id="app-container" class="min-h-screen w-full"></div>
  </div>

  <!-- Firebase & Application Logic -->
  <script type="module">
    // =========================================================================
    // KONFIGURASI APLIKASI
    // =========================================================================
    const IS_PREVIEW = false; // Ubah menjadi false SAAT DEPLOY / PUBLISH agar terhubung murni ke Firebase tanpa data dummy

    // PASTE FIREBASE CONFIG ANDA DI SINI
    const firebaseConfig = {
       apiKey: "AIzaSyBEOqdpTFnIVk46OXmT3_zsscRuSjk7tZU",
  authDomain: "absensikamera-7977a.firebaseapp.com",
  projectId: "absensikamera-7977a",
  storageBucket: "absensikamera-7977a.firebasestorage.app",
  messagingSenderId: "1049128772312",
  appId: "1:1049128772312:web:ad2b16d90b78e044956dad"
    };

    // =========================================================================
    // IMPORT FIREBASE SDK (v11.6.1)
    // =========================================================================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      getFirestore,
      collection,
      doc,
      getDoc,
      getDocs,
      setDoc,
      addDoc,
      updateDoc,
      deleteDoc,
      query,
      where,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // =========================================================================
    // REGISTRASI SERVICE WORKER (PWA 1 FILE VIA BLOB)
    // =========================================================================
    function registerInlineServiceWorker() {
      if ('serviceWorker' in navigator) {
        const swCode = `
          const CACHE_NAME = 'smartattend-qr-v1';
          self.addEventListener('install', (event) => {
            self.skipWaiting();
          });
          self.addEventListener('activate', (event) => {
            event.waitUntil(clients.claim());
          });
          self.addEventListener('fetch', (event) => {
            event.respondWith(
              fetch(event.request).catch(() => new Response('Offline mode aktif.'))
            );
          });
        `;
        try {
          const blob = new Blob([swCode], { type: 'application/javascript' });
          const swUrl = URL.createObjectURL(blob);
          navigator.serviceWorker.register(swUrl).catch(() => {});
        } catch (err) {
          // Abaikan jika lingkungan iframe membatasi SW
        }
      }
    }
    registerInlineServiceWorker();

    // =========================================================================
    // INISIALISASI FIREBASE (HANYA AKTIF JIKA IS_PREVIEW === false)
    // =========================================================================
    let app = null;
    let auth = null;
    let db = null;

    if (!IS_PREVIEW) {
      try {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
      } catch (error) {
        console.error("Kesalahan inisialisasi Firebase:", error);
      }
    }

    // =========================================================================
    // HELPER TANGGAL & WAKTU
    // =========================================================================
    function getTodayDateString() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getCurrentTimeString() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function calculateDuration(clockIn, clockOut) {
      if (!clockIn || !clockOut || clockOut === '-') return '-';
      const [h1, m1, s1 = 0] = clockIn.split(':').map(Number);
      const [h2, m2, s2 = 0] = clockOut.split(':').map(Number);
      const totalSec = (h2 * 3600 + m2 * 60 + s2) - (h1 * 3600 + m1 * 60 + s1);
      if (totalSec <= 0) return '0j 0m';
      const hrs = Math.floor(totalSec / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      return `${hrs}j ${mins}m`;
    }

    // =========================================================================
    // STATE APLIKASI (STRICT DUAL-MODE)
    // =========================================================================
    const state = {
      currentUser: null, // { role: 'admin' | 'employee', uid?, empId?, name, department? }
      loginTab: 'employee', // 'employee' | 'admin'
      activeMenu: 'scan', // Employee: 'scan' | 'history' | 'profile' || Admin: 'dashboard' | 'employees' | 'reports' | 'settings'
      scanMode: 'in', // 'in' | 'out'
      isScanning: false,
      scannerInstance: null,
      loading: false,

      // Koleksi Data (In-Memory saat IS_PREVIEW = true, Firestore saat IS_PREVIEW = false)
      employees: IS_PREVIEW ? [
        {
          id: 'doc-emp-1',
          empId: 'EMP-001',
          name: 'Budi Santoso',
          department: 'Operasional & IT',
          password: '123',
          status: 'active'
        },
        {
          id: 'doc-emp-2',
          empId: 'EMP-002',
          name: 'Siti Aminah',
          department: 'Keuangan & HR',
          password: '123',
          status: 'active'
        }
      ] : [],

      attendances: IS_PREVIEW ? [
        {
          id: 'att-1',
          empId: 'EMP-001',
          empName: 'Budi Santoso',
          department: 'Operasional & IT',
          date: getTodayDateString(),
          clockIn: '07:52:10',
          clockOut: '-',
          status: 'Tepat Waktu',
          scanToken: 'OFFICE-MAIN-2026'
        },
        {
          id: 'att-2',
          empId: 'EMP-002',
          empName: 'Siti Aminah',
          department: 'Keuangan & HR',
          date: getTodayDateString(),
          clockIn: '08:14:05',
          clockOut: '-',
          status: 'Terlambat',
          scanToken: 'OFFICE-MAIN-2026'
        }
      ] : [],

      settings: IS_PREVIEW ? {
        startTime: '08:00',
        endTime: '17:00',
        officeQrCode: 'OFFICE-MAIN-2026'
      } : {
        startTime: '08:00',
        endTime: '17:00',
        officeQrCode: 'OFFICE-MAIN-QR'
      },

      // Filter UI
      filterDate: getTodayDateString(),
      filterSearch: '',
      historyMonth: getTodayDateString().slice(0, 7)
    };

    // =========================================================================
    // UI FEEDBACK (TOAST & CUSTOM MODAL - TANPA ALERT/CONFIRM)
    // =========================================================================
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const colors = {
        success: 'bg-emerald-600 text-white border-emerald-500',
        error: 'bg-rose-600 text-white border-rose-500',
        warning: 'bg-amber-500 text-white border-amber-400',
        info: 'bg-slate-800 text-white border-slate-700'
      };

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg border text-sm font-medium transition-all duration-300 transform translate-y-0 opacity-100 ${colors[type] || colors.info}`;
      toast.innerHTML = `
        <span class="flex-1">${message}</span>
        <button class="text-white/80 hover:text-white font-bold text-base leading-none" onclick="this.parentElement.remove()">&times;</button>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-8px)';
        setTimeout(() => toast.remove(), 300);
      }, 3800);
    }

    function openModal(htmlContent) {
      const backdrop = document.getElementById('custom-modal-backdrop');
      const box = document.getElementById('custom-modal-box');
      box.innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
      if (window.lucide) window.lucide.createIcons();
    }

    window.closeModal = function () {
      const backdrop = document.getElementById('custom-modal-backdrop');
      backdrop.classList.add('hidden');
    };

    // =========================================================================
    // OPERASI DATA FIRESTORE (AKTIF SAAT IS_PREVIEW === false)
    // =========================================================================
    async function loadFirestoreData() {
      if (IS_PREVIEW || !db) return;
      state.loading = true;
      renderApp();

      try {
        // 1. Load Settings
        const settingsRef = doc(db, 'settings', 'work_schedule');
        const settingsSnap = await getDoc(settingsRef);
        if (settingsSnap.exists()) {
          state.settings = { ...state.settings, ...settingsSnap.data() };
        }

        // 2. Load Employees (Admin butuh semua, Karyawan sudah tervalidasi saat login)
        if (state.currentUser?.role === 'admin') {
          const empSnap = await getDocs(collection(db, 'employees'));
          state.employees = empSnap.docs.map(d => ({ id: d.id, ...d.data() }));

          const attSnap = await getDocs(collection(db, 'attendances'));
          state.attendances = attSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        } else if (state.currentUser?.role === 'employee') {
          const qAtt = query(
            collection(db, 'attendances'),
            where('empId', '==', state.currentUser.empId)
          );
          const attSnap = await getDocs(qAtt);
          state.attendances = attSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        }
      } catch (err) {
        console.error('Gagal memuat data Firestore:', err);
        showToast('Gagal memuat data dari server: ' + err.message, 'error');
      } finally {
        state.loading = false;
        renderApp();
      }
    }

    // =========================================================================
    // SISTEM AUTENTIKASI HYBRID
    // =========================================================================
    async function handleAdminLogin(email, password) {
      if (!email || !password) {
        showToast('Email dan password Admin wajib diisi.', 'warning');
        return;
      }

      if (IS_PREVIEW) {
        state.currentUser = {
          role: 'admin',
          uid: 'preview-admin-uid',
          name: 'Administrator HRD',
          email: email
        };
        state.activeMenu = 'dashboard';
        showToast('Berhasil masuk sebagai Admin (Mode Preview).', 'success');
        renderApp();
        return;
      }

      // Mode Produksi: Firebase Authentication
      try {
        state.loading = true;
        renderApp();
        const cred = await signInWithEmailAndPassword(auth, email, password);
        state.currentUser = {
          role: 'admin',
          uid: cred.user.uid,
          name: cred.user.email.split('@')[0],
          email: cred.user.email
        };
        state.activeMenu = 'dashboard';
        showToast('Login Admin berhasil.', 'success');
        await loadFirestoreData();
      } catch (err) {
        state.loading = false;
        showToast('Login Admin gagal: Email atau password salah.', 'error');
        renderApp();
      }
    }

    async function handleEmployeeLogin(empIdInput, passwordInput) {
      const empId = empIdInput.trim().toUpperCase();
      const password = passwordInput.trim();

      if (!empId || !password) {
        showToast('ID Karyawan dan Password wajib diisi.', 'warning');
        return;
      }

      if (IS_PREVIEW) {
        const found = state.employees.find(
          e => e.empId.toUpperCase() === empId && e.password === password
        );
        if (!found) {
          showToast('ID Karyawan atau Password tidak cocok (Mode Preview).', 'error');
          return;
        }
        if (found.status !== 'active') {
          showToast('Akun karyawan ini sedang dinonaktifkan.', 'error');
          return;
        }
        state.currentUser = {
          role: 'employee',
          id: found.id,
          empId: found.empId,
          name: found.name,
          department: found.department
        };
        state.activeMenu = 'scan';
        showToast(`Selamat datang, ${found.name}!`, 'success');
        renderApp();
        return;
      }

      // Mode Produksi: Validasi langsung terhadap koleksi 'employees' di Firestore
      try {
        state.loading = true;
        renderApp();
        const q = query(collection(db, 'employees'), where('empId', '==', empId));
        const snap = await getDocs(q);

        if (snap.empty) {
          state.loading = false;
          showToast('ID Karyawan tidak ditemukan di sistem.', 'error');
          renderApp();
          return;
        }

        const empDoc = snap.docs[0];
        const empData = empDoc.data();

        if (empData.password !== password) {
          state.loading = false;
          showToast('Password karyawan salah.', 'error');
          renderApp();
          return;
        }

        if (empData.status !== 'active') {
          state.loading = false;
          showToast('Akun Anda berstatus non-aktif. Hubungi HRD/Admin.', 'error');
          renderApp();
          return;
        }

        state.currentUser = {
          role: 'employee',
          id: empDoc.id,
          empId: empData.empId,
          name: empData.name,
          department: empData.department
        };
        state.activeMenu = 'scan';
        showToast(`Selamat datang, ${empData.name}!`, 'success');
        await loadFirestoreData();
      } catch (err) {
        state.loading = false;
        showToast('Terjadi kesalahan saat verifikasi akun: ' + err.message, 'error');
        renderApp();
      }
    }

    async function handleLogout() {
      await stopCameraScanner();
      if (!IS_PREVIEW && state.currentUser?.role === 'admin' && auth) {
        try {
          await signOut(auth);
        } catch (e) {}
      }
      state.currentUser = null;
      if (!IS_PREVIEW) {
        state.employees = [];
        state.attendances = [];
      }
      showToast('Anda telah keluar dari sistem.', 'info');
      renderApp();
    }

    // =========================================================================
    // LOGIKA SCAN KAMERA & PENCATATAN ABSENSI
    // =========================================================================
    async function stopCameraScanner() {
      if (state.scannerInstance) {
        try {
          if (state.isScanning) {
            await state.scannerInstance.stop();
          }
          state.scannerInstance.clear();
        } catch (e) {
          // Abaikan error saat kamera sudah berhenti
        }
        state.scannerInstance = null;
      }
      state.isScanning = false;
    }

    async function startCameraScanner() {
      const readerEl = document.getElementById('qr-reader');
      if (!readerEl) return;

      await stopCameraScanner();

      try {
        const html5QrCode = new Html5Qrcode("qr-reader");
        state.scannerInstance = html5QrCode;
        state.isScanning = true;
        updateScannerButtons();

        await html5QrCode.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 230, height: 230 }
          },
          async (decodedText) => {
            await stopCameraScanner();
            updateScannerButtons();
            await processQrScanResult(decodedText.trim());
          },
          () => {
            // Frame scanning error normal diabaikan
          }
        );
      } catch (err) {
        state.isScanning = false;
        updateScannerButtons();
        showToast('Kamera tidak dapat diakses. Pastikan izin kamera aktif atau gunakan tombol Simulasi/Input Kode QR.', 'warning');
      }
    }

    function updateScannerButtons() {
      const btnStart = document.getElementById('btn-start-scan');
      const btnStop = document.getElementById('btn-stop-scan');
      if (btnStart && btnStop) {
        btnStart.classList.toggle('hidden', state.isScanning);
        btnStop.classList.toggle('hidden', !state.isScanning);
      }
    }

    async function processQrScanResult(scannedCode) {
      if (!state.currentUser || state.currentUser.role !== 'employee') return;

      // Validasi QR Code Kantor atau QR ID Karyawan sendiri
      const validOfficeCode = state.settings.officeQrCode;
      const validPersonalCode = state.currentUser.empId;

      if (scannedCode !== validOfficeCode && scannedCode !== validPersonalCode) {
        showToast(`QR Code tidak valid ("${scannedCode}"). Pindai QR Resmi Kantor!`, 'error');
        return;
      }

      const today = getTodayDateString();
      const nowTime = getCurrentTimeString();
      const empId = state.currentUser.empId;

      // Cek apakah sudah ada record hari ini
      const existingRecord = state.attendances.find(
        a => a.empId === empId && a.date === today
      );

      if (state.scanMode === 'in') {
        if (existingRecord) {
          showToast(`Anda sudah melakukan Absen Masuk hari ini pada pukul ${existingRecord.clockIn}.`, 'warning');
          return;
        }

        // Tentukan status Tepat Waktu vs Terlambat
        const [startH, startM] = state.settings.startTime.split(':').map(Number);
        const [curH, curM] = nowTime.split(':').map(Number);
        const isLate = (curH > startH) || (curH === startH && curM > startM);
        const statusLabel = isLate ? 'Terlambat' : 'Tepat Waktu';

        const newRecord = {
          empId: empId,
          empName: state.currentUser.name,
          department: state.currentUser.department,
          date: today,
          clockIn: nowTime,
          clockOut: '-',
          status: statusLabel,
          scanToken: scannedCode
        };

        if (IS_PREVIEW) {
          newRecord.id = 'att-' + Date.now();
          state.attendances.unshift(newRecord);
          showToast(`Absen Masuk berhasil (${nowTime}) — Status: ${statusLabel}`, 'success');
          renderApp();
        } else {
          try {
            const docRef = await addDoc(collection(db, 'attendances'), {
              ...newRecord,
              timestamp: serverTimestamp()
            });
            newRecord.id = docRef.id;
            state.attendances.unshift(newRecord);
            showToast(`Absen Masuk tercatat di server (${nowTime}) — ${statusLabel}`, 'success');
            renderApp();
          } catch (err) {
            showToast('Gagal menyimpan Absen Masuk: ' + err.message, 'error');
          }
        }
      } else if (state.scanMode === 'out') {
        if (!existingRecord) {
          showToast('Anda belum melakukan Absen Masuk hari ini. Silakan Absen Masuk terlebih dahulu.', 'warning');
          return;
        }
        if (existingRecord.clockOut && existingRecord.clockOut !== '-') {

    window.exportAttendancesCsv = function () {
      const filtered = getFilteredAttendances();
      if (filtered.length === 0) {
        showToast('Tidak ada data absensi untuk diekspor.', 'warning');
        return;
      }
      const headers = ['Tanggal', 'ID Karyawan', 'Nama Karyawan', 'Divisi', 'Jam Masuk', 'Jam Pulang', 'Durasi', 'Status'];
      const rows = filtered.map(a => [
        a.date,
        a.empId,
        `"${a.empName}"`,
        `"${a.department}"`,
        a.clockIn,
        a.clockOut,
        calculateDuration(a.clockIn, a.clockOut),
        a.status
      ]);

      const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Laporan-Absensi-${state.filterDate || 'Semua'}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Laporan CSV berhasil diunduh.', 'success');
    };

    function getFilteredAttendances() {
      return state.attendances.filter(a => {
        const matchDate = state.filterDate ? a.date === state.filterDate : true;
        const q = state.filterSearch.toLowerCase();
        const matchSearch = !q || a.empName.toLowerCase().includes(q) || a.empId.toLowerCase().includes(q) || a.department.toLowerCase().includes(q);
        return matchDate && matchSearch;
      });
    }

                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">Token QR Resmi Kantor</label>
                <div class="flex gap-2">
                  <input type="text" id="set-office-qr" required value="${state.settings.officeQrCode}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 font-mono text-sm bg-white outline-none focus:ring-2 focus:ring-blue-500" />
                  <button type="button" onclick="generateRandomOfficeToken()" class="px-3.5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-semibold text-slate-700 shrink-0">Acak Token</button>
                </div>
                <p class="text-[11px] text-slate-400 mt-1">Jika diubah, cetak ulang QR Kantor agar sesuai dengan token terbaru.</p>
              </div>

              <div class="pt-3">
                <button type="submit" class="w-full py-3 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm shadow-md shadow-blue-600/20">
                  Simpan Pengaturan
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // MAIN RENDER CONTROLLER
    // =========================================================================
    function renderApp() {
      const root = document.getElementById('app-container');
      if (!root) return;

      if (!state.currentUser) {
        root.innerHTML = renderLoginView();
        bindLoginEvents();
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      let contentHtml = '';
      if (state.currentUser.role === 'employee') {
        if (state.activeMenu === 'scan') contentHtml = renderEmployeeScanView();
        else if (state.activeMenu === 'history') contentHtml = renderEmployeeHistoryView();
        else if (state.activeMenu === 'profile') contentHtml = renderEmployeeProfileView();
      } else {
        if (state.activeMenu === 'dashboard') contentHtml = renderAdminDashboardView();
        else if (state.activeMenu === 'employees') contentHtml = renderAdminEmployeesView();
        else if (state.activeMenu === 'reports') contentHtml = renderAdminReportsView();
        else if (state.activeMenu === 'settings') contentHtml = renderAdminSettingsView();
      }

      root.innerHTML = `
        ${renderNavigation()}
        <main class="main-workspace min-h-screen p-4 sm:p-8">
          ${IS_PREVIEW ? `
            <div class="max-w-6xl mx-auto mb-5 px-4 py-2.5 rounded-2xl bg-amber-50 border border-amber-200/80 text-amber-800 text-xs flex items-center justify-between gap-2">
              <span class="flex items-center gap-2 font-medium">
                <i data-lucide="info" class="w-4 h-4 text-amber-600 shrink-0"></i>
                Mode Preview In-Memory aktif. Data tidak disimpan ke Firebase.
              </span>
              <span class="font-mono font-bold text-[11px] bg-amber-100 px-2 py-0.5 rounded">IS_PREVIEW = true</span>
            </div>
          ` : ''}

          ${state.loading ? `
            <div class="flex flex-col items-center justify-center py-20 text-slate-500">
              <div class="w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-3"></div>
              <p class="text-sm font-medium">Menghubungkan ke database...</p>
            </div>
          ` : contentHtml}
        </main>
      `;

      bindDynamicEvents();
      if (window.lucide) window.lucide.createIcons();
    }

    function bindLoginEvents() {
      const empForm = document.getElementById('login-employee-form');
      if (empForm) {
        empForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const idVal = document.getElementById('login-emp-id').value;
          const passVal = document.getElementById('login-emp-pass').value;
          handleEmployeeLogin(idVal, passVal);
        });
      }

      const adminForm = document.getElementById('login-admin-form');
      if (adminForm) {
        adminForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const emailVal = document.getElementById('login-admin-email').value;
          const passVal = document.getElementById('login-admin-pass').value;
          handleAdminLogin(emailVal, passVal);
        });
      }
    }

    function bindDynamicEvents() {
      // Render QR Code Pribadi pada tab Profil Karyawan
      if (state.currentUser?.role === 'employee' && state.activeMenu === 'profile') {
        const qrBox = document.getElementById('employee-id-qrcode');
        if (qrBox && window.QRCode) {
          qrBox.innerHTML = '';
          new QRCode(qrBox, {
            text: state.currentUser.empId,
            width: 170,
            height: 170,
            colorDark: "#0f172a",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          });
        }
      }

      // Bind Settings Form (Admin)
      const settingsForm = document.getElementById('settings-form');
      if (settingsForm) {
        settingsForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const startTime = document.getElementById('set-start-time').value;
          const endTime = document.getElementById('set-end-time').value;
          const officeQrCode = document.getElementById('set-office-qr').value.trim();

          if (!officeQrCode) {
            showToast('Token QR Kantor tidak boleh kosong.', 'warning');
            return;
          }

          if (IS_PREVIEW) {
            state.settings = { startTime, endTime, officeQrCode };
            showToast('Pengaturan berhasil diperbarui (Mode Preview).', 'success');
          } else {
            try {
              await setDoc(doc(db, 'settings', 'work_schedule'), {
                startTime,
                endTime,
                officeQrCode
              }, { merge: true });
              state.settings = { startTime, endTime, officeQrCode };
              showToast('Pengaturan jam kerja & QR Kantor tersimpan di Firestore.', 'success');
            } catch (err) {
              showToast('Gagal menyimpan pengaturan: ' + err.message, 'error');
            }
          }
        });
      }
    }

    // =========================================================================
    // GLOBAL WINDOW HANDLERS UNTUK INLINE ONCLICK
    // =========================================================================
    window.switchLoginTab = function (tab) {
      state.loginTab = tab;
      renderApp();
    };

    window.navigateMenu = async function (menuId) {
      if (state.isScanning) {
        await stopCameraScanner();
      }
      state.activeMenu = menuId;
      renderApp();
    };

    window.logoutApp = function () {
      handleLogout();
    };

    window.setScanMode = function (mode) {
      state.scanMode = mode;
      renderApp();
    };

    window.triggerStartCamera = function () {
      startCameraScanner();
    };

    window.triggerStopCamera = async function () {
      await stopCameraScanner();
      updateScannerButtons();
      renderApp();
    };

    window.simulateQrScan = function () {
      processQrScanResult(state.settings.officeQrCode);
    };

    window.updateHistoryMonth = function (val) {
      state.historyMonth = val;
      renderApp();
    };

    window.updateReportDate = function (val) {
      state.filterDate = val;
      renderApp();
    };

    window.updateReportSearch = function (val) {
      state.filterSearch = val;
      renderApp();
    };

    window.generateRandomOfficeToken = function () {
      const rand = 'OFFICE-' + Math.random().toString(36).substring(2, 8).toUpperCase();
      const input = document.getElementById('set-office-qr');
      if (input) input.value = rand;
    };

    // Start Initial Render
    renderApp();
  </script>
</body>
</html>
